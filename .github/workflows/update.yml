name: Update news and deploy site

on:
  schedule:
    # TLDR sends in the US morning; run a few times so late issues are picked up.
    - cron: "17 13,17,22 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to fetch (use e.g. 30 to backfill)"
        default: "3"
  push:
    branches: [main]
    paths: ["docs/**", "scraper/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      problems: ${{ steps.fetch.outputs.problems }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_parse.py
      - name: Fetch issues
        id: fetch
        # Exit code 2 = fetched what it could but something looks wrong (see the alert job).
        run: |
          set +e
          python scraper/scrape.py --days "${{ inputs.days || '3' }}" 2> >(tee errors.log >&2)
          code=$?
          if [ $code -eq 2 ]; then echo "problems=true" >> "$GITHUB_OUTPUT"; elif [ $code -ne 0 ]; then exit $code; fi
      - name: Upload problem log
        if: steps.fetch.outputs.problems == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-problems
          path: errors.log
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No new stories."
          else
            git commit -m "Update news data $(date -u +%Y-%m-%d)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Fails the run (GitHub then emails you) when the scraper found no issues on a
  # weekday or couldn't parse an issue page, which usually means tldr.tech changed.
  alert:
    needs: scrape
    if: needs.scrape.outputs.problems == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The TLDR scraper hit problems. See the 'Fetch issues' step log or the scrape-problems artifact."
          exit 1
