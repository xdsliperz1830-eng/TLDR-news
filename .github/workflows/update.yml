name: Update news and deploy site

on:
  schedule:
    # TLDR sends in the US morning; run a few times so late issues are picked up.
    - cron: "17 13,17,22 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to fetch (use e.g. 30 to backfill)"
        default: "3"
  push:
    branches: [main]
    paths: ["docs/**", "scraper/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_parse.py
      - name: Fetch issues
        run: python scraper/scrape.py --days "${{ inputs.days || '3' }}"
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No new stories."
          else
            git commit -m "Update news data $(date -u +%Y-%m-%d)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
